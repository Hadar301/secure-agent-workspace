clusterGroup:
  name: prod
  namespaces:
    external-secrets:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    openshift-cnv:
      operatorGroup: true
      targetNamespaces:
        - openshift-cnv
    # Shared: golden image, image builds, governance interceptor.
    openshell-agents:
    # Keycloak and its RHBK operator (any namespace works; see
    # openshell-saw oidc.keycloakNamespace).
    keycloak:
      operatorGroup: true
      targetNamespaces:
        - keycloak
    # One namespace per user SAW. The label lets the shared governance
    # interceptor accept the SAW's gateway VM.
    saw-alice:
      labels:
        openshell.pattern/saw: "true"
        openshell.pattern/owner: alice
    rhdh-operator:
      operatorGroup: true
      targetNamespaces: []
    # ansible-automation-platform:
    #   operatorGroup: true
    #   targetNamespaces: []
    redhat-ods-operator:
      operatorGroup: true
      targetNamespaces: []
    vault:
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    openshift-virtualization:
      name: kubevirt-hyperconverged
      namespace: openshift-cnv
      channel: stable
    rhbk:
      name: rhbk-operator
      namespace: keycloak
      channel: stable-v26
    rhdh:
      name: rhdh
      namespace: rhdh-operator
      channel: fast
    # aap:
    #   name: ansible-automation-platform-operator
    #   namespace: ansible-automation-platform
    #   channel: stable-2.5
    openshift-ai:
      name: rhods-operator
      namespace: redhat-ods-operator
      channel: fast
  applications:
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    vault:
      name: vault
      namespace: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*
    openshift-cnv:
      name: openshift-cnv
      namespace: openshift-cnv
      path: charts/openshift-cnv
    openshell-keycloak:
      name: openshell-keycloak
      namespace: keycloak
      path: charts/openshell-keycloak
    # The SAW's provider Secrets, profiles and VM live in its own namespace
    # (a VM can only attach ConfigMaps/Secrets from its namespace).
    pattern-secrets:
      name: pattern-secrets
      namespace: saw-alice
      path: charts/pattern-secrets
    governance-policy:
      name: governance-policy
      namespace: openshell-agents
      path: charts/governance-policy
    governance-interceptor:
      name: governance-interceptor
      namespace: openshell-agents
      path: charts/governance-interceptor
    saw-bom:
      name: saw-bom
      namespace: saw-alice
      path: charts/saw-bom
    openshell-saw:
      name: openshell-saw
      namespace: saw-alice
      path: charts/openshell-saw
      extraValueFiles:
        - /overrides/openshell-saw.yaml
