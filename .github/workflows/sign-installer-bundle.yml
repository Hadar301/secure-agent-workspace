name: Sign installer bundle

on:
  workflow_dispatch:

# COSIGN_PRIVATE_KEY is a GitHub Actions secret. It is never committed.
# Download the artifact and commit charts/openshell-saw/files/installer/bundle.sigstore.json
# when the chart should carry the signature. See docs/versioned-bom-installer.md.
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - name: Render the three installer files and sign them
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "COSIGN_PRIVATE_KEY is not configured. Refusing to sign." >&2
            exit 1
          fi
          pip install -q pyyaml
          helm template saw-sign charts/openshell-saw --namespace saw-sign --set sandboxName=saw-sign > /tmp/rendered.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          cm = next(d for d in docs if d["kind"] == "ConfigMap" and d["metadata"]["name"] == "saw-sign-installer")
          data = cm["data"]
          # Same order as /usr/libexec/saw/verify-bundle.
          payload = data["installer-bom.yaml"] + data["apply_bom.py"] + data["setup-dashboard.sh"]
          open("/tmp/installer-payload", "w", encoding="utf-8").write(payload)
          PY
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --bundle bundle.sigstore.json /tmp/installer-payload
          echo "Signed the rendered installer-bom.yaml, apply_bom.py, and setup-dashboard.sh."
          echo "The private key was not written to the workspace."
      - uses: actions/upload-artifact@v4
        with:
          name: bundle.sigstore.json
          path: bundle.sigstore.json
