name: SAW minimal Pattern deployment E2E

on:
  workflow_dispatch:
    inputs:
      cluster_api_url:
        description: OpenShift API URL, for example https://api.example.test:6443
        required: true
        type: string
      cluster_username:
        description: OpenShift cluster username
        required: true
        type: string
      cluster_password:
        description: OpenShift cluster password (visible input, not a GitHub secret)
        required: true
        type: string
      nvidia_api_key:
        description: NVIDIA API key (visible input, not a GitHub secret)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: saw-tp-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      E2E_SOURCE_SHA: ${{ github.sha }}
      E2E_TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Mask manual credential inputs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            for (const key of ['cluster_username', 'cluster_password', 'nvidia_api_key']) {
              if (event.inputs?.[key]) core.setSecret(event.inputs[key]);
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify selected SHA
        run: test "$(git rev-parse HEAD)" = "$E2E_SOURCE_SHA"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest
      - name: Check runner tools
        run: |
          command -v oc
          command -v helm
          command -v podman
          command -v jq
          command -v uv
      - name: Set private paths
        run: |
          printf 'E2E_CONFIG=%s/saw-tp-e2e/config.yaml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'E2E_STATE_DIR=%s/saw-tp-e2e/reports\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Create private test inputs
        run: uv run --locked python scripts/saw-tp-e2e-ci-config.py "$E2E_CONFIG"
      - name: Run the deployment test
        run: make test-saw-tp-e2e E2E_CONFIG="$E2E_CONFIG"
      - name: Upload filtered test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saw-tp-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/saw-tp-e2e/reports/*.report.json
            ${{ runner.temp }}/saw-tp-e2e/reports/*.junit.xml
          if-no-files-found: warn
          retention-days: 14
