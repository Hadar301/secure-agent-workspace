name: SAW minimal Pattern deployment E2E

on:
  workflow_dispatch:
    inputs:
      cluster_api_url:
        description: OpenShift API URL, for example https://api.example.test:6443
        required: true
        type: string
      source_sha:
        description: Full SHA of the pushed PR implementation commit
        required: true
        type: string
      model:
        description: NVIDIA model identifier
        required: true
        default: nvidia/nemotron-3-super-120b-a12b
        type: string

permissions:
  contents: read

concurrency:
  group: saw-tp-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      E2E_CONFIG: ${{ runner.temp }}/saw-tp-e2e/config.yaml
      E2E_SOURCE_SHA: ${{ inputs.source_sha }}
      E2E_TARGET_BRANCH: ${{ github.ref_name }}
      E2E_STATE_DIR: ${{ runner.temp }}/saw-tp-e2e/reports
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify selected SHA
        run: test "$(git rev-parse HEAD)" = "$E2E_SOURCE_SHA"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest
      - name: Check runner tools
        run: |
          command -v oc
          command -v helm
          command -v podman
          command -v jq
          command -v uv
      - name: Create private test inputs
        env:
          SAW_E2E_API_URL: ${{ inputs.cluster_api_url }}
          SAW_E2E_MODEL: ${{ inputs.model }}
          SAW_E2E_USERNAME: ${{ secrets.SAW_E2E_USERNAME }}
          SAW_E2E_PASSWORD: ${{ secrets.SAW_E2E_PASSWORD }}
          SAW_E2E_NVIDIA_API_KEY: ${{ secrets.SAW_E2E_NVIDIA_API_KEY }}
          SAW_E2E_API_CA_PEM: ${{ secrets.SAW_E2E_API_CA_PEM }}
          SAW_E2E_INGRESS_CA_PEM: ${{ secrets.SAW_E2E_INGRESS_CA_PEM }}
        run: uv run --locked python scripts/saw-tp-e2e-ci-config.py "$E2E_CONFIG"
      - name: Run the deployment test
        run: make test-saw-tp-e2e E2E_CONFIG="$E2E_CONFIG"
      - name: Upload filtered test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saw-tp-e2e-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/saw-tp-e2e/reports/*.report.json
            ${{ runner.temp }}/saw-tp-e2e/reports/*.junit.xml
          if-no-files-found: warn
          retention-days: 14
