name: Credential proxy

on:
  push:
    branches: [main]
    paths:
      - credential-proxy/**
      - .github/workflows/credential-proxy.yml
      - .github/actions/build-push-image/**
      - .github/actions/merge-image/**
  pull_request:
    paths:
      - credential-proxy/**
      - .github/workflows/credential-proxy.yml
      - .github/actions/build-push-image/**
      - .github/actions/merge-image/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: credential-proxy/go.mod
      - name: Vet
        working-directory: credential-proxy
        run: go vet ./...
      - name: Test
        working-directory: credential-proxy
        run: go test -race ./...
      - name: Build binary
        working-directory: credential-proxy
        run: CGO_ENABLED=0 go build ./cmd/saw-credential-proxy

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-push-image
        with:
          image_name: saw-credential-proxy
          context: credential-proxy
          dockerfile: credential-proxy/Containerfile
          cache_scope: saw-credential-proxy
          platform: ${{ matrix.platform }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

  merge:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/merge-image
        with:
          image_name: saw-credential-proxy
          registry_token: ${{ secrets.GITHUB_TOKEN }}
