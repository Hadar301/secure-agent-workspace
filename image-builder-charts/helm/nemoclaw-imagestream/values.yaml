source:
  git:
    uri: "https://github.com/NVIDIA/NemoClaw.git"
    ref: "6f3cced4230ae9660c049cc11804daf37797c595" # v0.0.124

build:
  # Empty: the build node's architecture (buildah sets TARGETARCH), so an
  # arm64 cluster builds an arm64 image. Set amd64/arm64 to force one.
  targetArch: ""
  # NemoClaw v0.0.124 base image (multi-arch: amd64 and arm64).
  baseImage: "ghcr.io/nvidia/nemoclaw/sandbox-base:v0.0.124"
  model: "claude-sonnet-4-6"
  inferenceBaseUrl: "https://inference.local/v1"
  inferenceApi: "openai-completions"
  contextWindow: "200000"
  maxTokens: "8192"
  reasoning: "false"
  toolDisclosure: "progressive"
  agentTimeout: "600"
  webSearchEnabled: "1"

output:
  imageStreamTag: "nemoclaw-sandbox:latest"
