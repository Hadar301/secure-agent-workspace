{{- $imageName := ternary "openshell-gateway-docker" "openshell-gateway" (eq .Values.containerRuntime "docker") -}}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ $imageName }}
  labels:
    {{- include "openshell-gateway-image.labels" . | nindent 4 }}
spec:
  lookupPolicy:
    local: true
