{{- with .Values.registryPullSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.secretStoreRef.name }}
    kind: {{ $.Values.secretStoreRef.kind }}
  target:
    name: {{ . }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ $.Values.sshVaultPrefix | default $.Values.vaultPrefix }}/registry-pull
        property: token
{{- end }}
