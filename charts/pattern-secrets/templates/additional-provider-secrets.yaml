{{- $reserved := list "inference" "inference-meta" "web-search" "web-search-meta" "openshell-ssh-pubkey" "openshell-aap-ssh" (.Values.clusterCaSecret | default "") }}
{{- range .Values.secrets | default list | uniq }}
{{- if not (has . $reserved) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . | quote }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.secretStoreRef.name }}
    kind: {{ $.Values.secretStoreRef.kind }}
  target:
    name: {{ . | quote }}
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $.Values.vaultPrefix . | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-meta" . | quote }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.secretStoreRef.name }}
    kind: {{ $.Values.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-meta" . | quote }}
    template:
      type: Opaque
      engineVersion: v2
      data:
        provider: {{ `{{ index . "provider" | default "" }}` | quote }}
        model: {{ `{{ index . "model" | default "" }}` | quote }}
        url: {{ `{{ index . "url" | default "" }}` | quote }}
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $.Values.vaultPrefix . | quote }}
{{- end }}
{{- end }}
