{{- if and .Values.enabled (eq .Values.mode "kata") }}
{{- $name := printf "%s-kata" (include "saw-runtime-policies.name" .) }}
{{- $confidentialWorkloads := .Values.confidentialWorkloads | toJson }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.targetNamespace | quote }}
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: [CREATE, UPDATE]
        resources: [sandboxes]
  validations:
    - expression: >-
        has(object.spec.podTemplate.spec.runtimeClassName) &&
        object.spec.podTemplate.spec.runtimeClassName == {{ .Values.workloadRuntimeClassName | toJson }}
      message: The Sandbox workload template must use the approved Kata RuntimeClass.
{{- if .Values.confidentialMode }}
    - expression: >-
        object.metadata.name in {{ $confidentialWorkloads }} &&
        has(object.spec.podTemplate.metadata.annotations) &&
        object.spec.podTemplate.metadata.annotations['io.katacontainers.config.hypervisor.cc_init_data'] ==
          {{ $confidentialWorkloads }}[object.metadata.name].init_data
      message: The Sandbox init-data must match the approved confidential slot.
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
