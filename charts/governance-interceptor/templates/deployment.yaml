{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-interceptor
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: governance-interceptor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governance-interceptor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: interceptor
          image: {{ .Values.image }}
          args:
            - --listen
            - "0.0.0.0:{{ .Values.port }}"
            - --policy
            - /config/policy.yaml
            - --profiles
            - /config/profiles
            {{- if .Values.gatewayEndpoint }}
            - --gateway-endpoint
            - {{ .Values.gatewayEndpoint | quote }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: policy
              mountPath: /config/policy.yaml
              subPath: policy.yaml
              readOnly: true
            - name: policy
              mountPath: /config/profiles/github.yaml
              subPath: github-profile.yaml
              readOnly: true
            - name: policy
              mountPath: /config/profiles/inference.yaml
              subPath: inference-profile.yaml
              readOnly: true
            - name: policy
              mountPath: /config/profiles/google-vertex-ai.yaml
              subPath: google-vertex-ai-profile.yaml
              readOnly: true
            - name: policy
              mountPath: /config/profiles/slack.yaml
              subPath: slack-profile.yaml
              readOnly: true
        - name: envoy-tls-proxy
          image: envoyproxy/envoy:v1.33-latest
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: grpc-tls
              containerPort: 18443
              protocol: TCP
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: tls-certs
              mountPath: /tls
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: governance-interceptor-policy
        - name: envoy-config
          configMap:
            name: governance-interceptor-envoy
        - name: tls-certs
          secret:
            secretName: governance-interceptor-tls
{{- end }}
