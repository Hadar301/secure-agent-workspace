{{- if .Values.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: governance-interceptor
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    haproxy.router.openshift.io/backend-protocol: h2
spec:
  port:
    targetPort: grpc-tls
  tls:
    termination: reencrypt
  to:
    kind: Service
    name: governance-interceptor
{{- end }}
