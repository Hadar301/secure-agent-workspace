{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: governance-interceptor
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: governance-interceptor
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.port }}
          protocol: TCP
      from:
        # KubeVirt VM pods (gateway connects to interceptor)
        - podSelector:
            matchLabels:
              kubevirt.io: virt-launcher
        # Setup Job pods (preflight check)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell-saw
{{- end }}
