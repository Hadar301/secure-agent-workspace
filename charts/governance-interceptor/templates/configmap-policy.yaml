{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-interceptor-policy
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  policy.yaml: |
{{ .Files.Get "policy.yaml" | indent 4 }}
{{- range $path, $_ := .Files.Glob "profiles/*.yaml" }}
  {{ base $path | replace ".yaml" "-profile.yaml" }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
