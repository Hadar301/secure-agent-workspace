{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-interceptor-policy
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  policy.yaml: |
    version: 1

    filesystem_policy:
      include_workdir: true
      read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
      read_write: [/sandbox, /tmp, /dev/null]

    landlock:
      compatibility: best_effort

    process:
      run_as_user: sandbox
      run_as_group: sandbox

    network_policies:
      inference:
        name: inference-api
        endpoints:
          - host: inference.local
            port: 443
            protocol: rest
            enforcement: enforce
            access: full
        binaries:
          - path: /usr/bin/curl

    tool_policies:
      - name: allow-core-tools
        tools:
          - web-search
          - file-read
          - file-write
          - code-execution
        action: allow

      - name: block-dangerous-tools
        tools:
          - shell-exec
          - network-scan
          - process-spawn
        action: deny

  github-profile.yaml: |
    display_name: GitHub
    description: GitHub API integration
    provider_type: custom
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest

  slack-profile.yaml: |
    display_name: Slack
    description: Slack API integration
    provider_type: custom
    endpoints:
      - host: slack.com
        port: 443
        protocol: rest
{{- end }}
