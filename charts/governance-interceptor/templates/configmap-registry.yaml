{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-profile-registry
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: profile-registry
data:
{{- range $path, $_ := .Files.Glob "profiles/*.yaml" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
