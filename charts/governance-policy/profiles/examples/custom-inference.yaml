# Example: a provider profile for an OpenAI-compatible inference server of
# your own (vLLM, Ollama, NIM, a cloud endpoint). Files in this examples/
# directory are NOT served: the chart vends profiles/*.yaml only. To use it,
# copy it to overrides/governance-profiles/custom-inference.yaml, set
# `endpoints` to your server, list the file in that directory's
# kustomization.yaml and push; docs/custom-inference.md has the full flow.
#
# One profile per credential: several hosts that share one key may be listed
# together; a second server with its own key is a second file with its own
# id, used by a SAW-BOM provider named and typed after that id (the
# governance interceptor matches sandbox providers by profile id).
# OpenShell: do not reuse the `openai` profile for another host; a provider
# pointing OPENAI_BASE_URL elsewhere is endpointless (the key is never sent).
id: custom-inference
display_name: Custom inference endpoint
description: OpenAI-compatible inference server named by this deployment
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: API key of the custom inference endpoint
    env_vars: [CUSTOM_INFERENCE_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: custom.inference.local     # the host of the `url` in the inference Secret
    port: 443                        # its port (443 for https without one, 8000 for a vLLM Service)
    protocol: rest
    enforcement: enforce
    access: read-write
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  # OpenClaw's node: /usr/bin/node-<major> in the Hummingbird image
  # (/usr/bin/node links to it; the real path is what is matched),
  # /usr/local/bin/node in the NemoClaw image.
  - /usr/bin/node
  - /usr/bin/node-*
  - /usr/local/bin/node
