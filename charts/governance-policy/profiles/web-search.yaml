display_name: Web Search
description: Tavily and Brave Search API endpoints for agent web search capability
provider_type: custom
endpoints:
  - host: api.tavily.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
  - host: api.search.brave.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
