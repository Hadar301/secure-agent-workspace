display_name: GitHub
description: GitHub API and Git operations
provider_type: custom
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
binaries: [/usr/bin/gh, /usr/local/bin/gh, /usr/bin/git, /usr/local/bin/git]
