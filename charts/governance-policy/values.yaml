# Governance policy data — provider profiles and sandbox policy.
# profiles/*.yaml are the shipped catalog (vended as they are). A
# deployment's own profiles (a custom inference host, say) go in
# overrides/governance-profiles/ instead, served next to these by the
# governance-extra-profiles application; profiles/examples/ holds templates
# to copy there and is not vended. The interceptor reloads on change.
enabled: true
