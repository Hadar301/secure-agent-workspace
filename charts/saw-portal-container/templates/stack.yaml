{{- /* The site supplies reviewed values for the stock charts. No tpl: owner input
       must never become a Helm program or choose a source, namespace or chart. */ -}}
{{- $site := .Values.site | default dict }}
{{- $stack := $site.stack | default dict }}
{{- if $stack }}
{{- $u := .Values.owner }}
{{- $reg := .Values.registration }}
{{- $runtime := .Release.Namespace }}
{{- $trusted := printf "saw-ctl-%s" $reg }}
{{- $archive := printf "saw-history-%s" $reg }}
{{- $g := .Values.global }}
{{- $ownerID := required "installationID required" .Values.installationID }}
{{- $ui := printf "saw-ui-%s" $reg }}
{{- $map := dict "RUNTIME" $runtime "TRUSTED" $trusted "ARCHIVE" $archive "UI" $ui "OWNER" $u "SUBJECT" .Values.ownerSubject "INSTALLATION" $ownerID "DOMAIN" $g.clusterDomain }}
{{- $targets := include "portal.targets" . | fromJson }}
{{- $confidentialEnabled := dig "attestation" "enabled" false $site }}
{{- $confidentialSupervisors := dict }}
{{- $confidentialWorkloads := dict }}
{{- $policyConfidentialSupervisors := dict }}
{{- $policyConfidentialWorkloads := dict }}
{{- if $confidentialEnabled }}
{{- if not $site.kataRuntimeClass }}{{ fail "confidential attestation requires an approved Kata RuntimeClass" }}{{ end }}
{{- $confidentialBinding := dig "enrollment" "intent" "bindings" "confidentialAttestation" dict $site }}
{{- $placements := get $confidentialBinding "placements" }}
{{- if not (kindIs "map" $placements) }}{{ fail "confidential enrollment placements are missing" }}{{ end }}
{{- $resources := dict }}
{{- range $binding := $site.providerPolicy.bindings }}
{{- if or (not $binding.secret) (not (regexMatch "^[a-z0-9][a-z0-9-]{0,62}$" $binding.secret)) }}{{ fail "confidential provider resource name is invalid" }}{{ end }}
{{- $_ := set $resources $binding.secret (printf "default/saw-%s-%s/%s" $u $reg $binding.secret) }}
{{- end }}
{{- if eq (len $resources) 0 }}{{ fail "confidential Trustee credential resources are missing" }}{{ end }}
{{- $bootstrapJSON := dict "schemaVersion" 1 "policy" $site.providerPolicy "resources" $resources "publicCAFile" "/run/openshell/saw-proxy-ca.pem" | toJson }}
{{- if gt (len $bootstrapJSON) 65536 }}{{ fail "confidential bootstrap JSON exceeds 64 KiB" }}{{ end }}
{{- range $slot := $targets }}
{{- $slotKey := printf "%s/%s" $slot.workspace $slot.sandbox }}
{{- $resourceName := printf "%s--%s" $slot.workspace $slot.sandbox }}
{{- if not (hasKey $placements $slotKey) }}{{ fail "confidential placement is missing for a selected workspace slot" }}{{ end }}
{{- $placement := get $placements $slotKey }}
{{- $supervisor := get $placement "supervisor" }}
{{- $workload := get $placement "workload" }}
{{- if or (not (kindIs "map" $supervisor)) (not (kindIs "map" $workload)) }}{{ fail "confidential slot placement is invalid" }}{{ end }}
{{- if or (ne $supervisor.runtime_class_name $site.kataRuntimeClass.name) (ne $workload.runtime_class_name $site.kataRuntimeClass.name) }}{{ fail "confidential placement RuntimeClass differs from the site approval" }}{{ end }}
{{- $supervisorPlacement := dict "runtime_class_name" $supervisor.runtime_class_name "init_data" $supervisor.init_data "bootstrap_json" $bootstrapJSON }}
{{- $workloadPlacement := dict "runtime_class_name" $workload.runtime_class_name "init_data" $workload.init_data }}
{{- $_ := set $confidentialSupervisors $slotKey $supervisorPlacement }}
{{- $_ := set $confidentialWorkloads $slotKey $workloadPlacement }}
{{- $_ := set $policyConfidentialSupervisors $resourceName $supervisorPlacement }}
{{- $_ := set $policyConfidentialWorkloads $resourceName $workloadPlacement }}
{{- end }}
{{- end }}
{{- $namespaces := dict $archive "retained" }}
{{- range $slot := $targets }}{{- if $slot.ui }}{{- $_ := set $namespaces (printf "saw-ui-%s" $slot.relayID) "ephemeral" }}{{- end }}{{- end }}
{{- range $name, $dest := $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    {{- if eq $dest "ephemeral" }}
    openshell.pattern/saw: "true"
    {{- end }}
    saw.redhat.com/runtime-owner: {{ $ownerID | quote }}
    saw.redhat.com/registration: {{ $reg | quote }}
    saw.redhat.com/portal-owner: {{ $u | quote }}
    pod-security.kubernetes.io/enforce: restricted
  {{- if eq $dest "retained" }}
  annotations: {argocd.argoproj.io/compare-options: IgnoreExtraneous, argocd.argoproj.io/sync-options: 'Prune=false,Delete=false', argocd.argoproj.io/sync-wave: "-2"}
  {{- else }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ $name }}, annotations: {argocd.argoproj.io/sync-wave: "-1"}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress], ingress: [], egress: []}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-api, namespace: {{ $trusted }}}
spec:
  podSelector: {matchLabels: {openshell.pattern/role: identity-bootstrap}}
  policyTypes: [Egress]
  egress: {{ $stack.proxy.values.network.bootstrapEgress | toJson }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ printf "saw-%s-governance" $reg }}, namespace: {{ required "governance namespace required" $site.governanceNamespace }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: governance-interceptor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $runtime }}}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: {{ $u }}, openshell.pattern/role: gateway}}
      ports: [{port: 18081, protocol: TCP}]
{{- if not $confidentialEnabled }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $u }}-proxy-policy, namespace: {{ $trusted }}}
data:
  config.json: |
    {{ required "explicit governed provider policy required" $site.providerPolicy | toJson }}
{{- end }}
{{- $charts := dict "identity" (list "saw-kubernetes-identity" $trusted) "policy" (list "saw-runtime-policies" $runtime) "gateway" (list "openshell-saw-kubernetes" $runtime) }}
{{- if not $confidentialEnabled }}{{- $_ := set $charts "proxy" (list "saw-kubernetes-proxy" $trusted) }}{{- end }}
{{- range $slot := $targets }}{{- $key := ternary "audit" (printf "audit-%s" $slot.relayID) (eq (len $targets) 1) }}{{- $_ := set $charts $key (list "saw-audit-writer" $archive $slot) }}{{- end }}
{{- range $key, $c := $charts }}
{{- $item := required (printf "missing site.stack.%s" $key) (get $stack (ternary "audit" $key (eq (len $c) 3))) }}
{{- if not (regexMatch "^[a-f0-9]{40}$" ($item.revision | default "")) }}{{ fail "each infrastructure chart must be pinned to a Git commit" }}{{ end }}
{{- $values := $item.values | toJson }}
{{- range $k, $v := $map }}
{{- $values = replace (printf "@%s@" $k) $v $values }}
{{- end }}
{{- if and (eq $key "gateway") $site.kataRuntimeClass }}
{{- $gateway := fromJson $values }}
{{- $_ := set $gateway "deployment" (dict "mode" "kata") }}
{{- $_ := set $gateway.kubernetes.workload "runtimeClassName" $site.kataRuntimeClass.name }}
{{- if $confidentialEnabled }}
{{- $_ := set $gateway.kubernetes "confidential" (dict "enabled" true "supervisors" $confidentialSupervisors "workloads" $confidentialWorkloads) }}
{{- $_ := set $gateway.kubernetes.proxy "url" "" }}
{{- $_ := set $gateway.kubernetes.proxy "caConfigMap" "" }}
{{- $driverApproval := $site.attestation.driver }}
{{- if or (not $driverApproval.gatewayImage) (not $driverApproval.supervisorImage) }}{{ fail "confidential gateway and supervisor images must be approved by digest" }}{{ end }}
{{- $gatewayKubernetes := get $gateway "kubernetes" }}
{{- if not (kindIs "map" $gatewayKubernetes) }}{{ fail "gateway Kubernetes values are required" }}{{ end }}
{{- $gatewayChart := get $gatewayKubernetes "gateway" | default dict }}
{{- if not (kindIs "map" $gatewayChart) }}{{ fail "gateway chart values must be a map" }}{{ end }}
{{- $_ := set $gatewayChart "image" $driverApproval.gatewayImage }}
{{- $_ := set $gatewayKubernetes "gateway" $gatewayChart }}
{{- $supervisorChart := get $gatewayKubernetes "supervisor" | default dict }}
{{- if not (kindIs "map" $supervisorChart) }}{{ fail "supervisor chart values must be a map" }}{{ end }}
{{- $_ := set $supervisorChart "image" $driverApproval.supervisorImage }}
{{- $_ := set $gatewayKubernetes "supervisor" $supervisorChart }}
{{- end }}
{{- $values = toJson $gateway }}
{{- end }}
{{- if eq $key "policy" }}
{{- $policy := fromJson $values }}
{{- if $site.kataRuntimeClass }}
{{- $_ := set $policy "mode" "kata" }}
{{- $_ := set $policy "workloadRuntimeClassName" $site.kataRuntimeClass.name }}
{{- end }}
{{- if $confidentialEnabled }}
{{- $_ := set $policy "confidentialMode" true }}
{{- $_ := set $policy "confidentialSupervisors" $policyConfidentialSupervisors }}
{{- $_ := set $policy "confidentialWorkloads" $policyConfidentialWorkloads }}
{{- end }}
{{- $gw := $stack.gateway.values.kubernetes }}
{{- $slots := dict }}
{{- range $key, $slot := $targets }}
{{- $binding := dig "enrollment" "intent" "bindings" "bindings" $key dict $site }}
{{- $_ := set $slots (printf "%s--%s" $slot.workspace $slot.sandbox) (dict "image" ($slot.image | default "") "base" $slot.base "relayID" $slot.relayID "dataMounts" ($binding.mounts | default list)) }}
{{- end }}
{{- $_ := set $policy "slots" $slots }}
{{- $_ := set $policy "preparationImage" (dig "enrollment" "image" (dig "automaticEnrollment" "image" "" $site) $site) }}
{{- $_ := set $policy "forwarderImage" $stack.audit.values.image }}
{{- $_ := set $policy "serverTLSSecret" (replace "@OWNER@" $u $gw.identity.serverTlsSecret) }}
{{- $_ := set $policy "supervisorImage" (dig "supervisor" "image" $.Values.driverDefaults.supervisorImage $gw) }}
{{- if $confidentialEnabled }}
{{- $_ := set $policy "supervisorImage" $site.attestation.driver.supervisorImage }}
{{- end }}
{{- $_ := set $policy "runtimeImage" ($gw.workload.runtimeImage | default $.Values.driverDefaults.runtimeImage) }}
{{- $proxyURL := replace "@TRUSTED@" $trusted (replace "@OWNER@" $u $gw.proxy.url) }}
{{- $supervisorArgs := list "/openshell-supervisor" "--backend-descriptor-file" "/.openshell/supervisor/runtime-descriptor.json" "--auth-bundle-file" "/.openshell/supervisor/auth.json" "--workdir" "/sandbox" "--health-socket-path" "/run/openshell/health.sock" "--health-port" "5501" }}
{{- if $confidentialEnabled }}
{{- $_ := set $policy "supervisorCommand" (concat (list "/usr/local/bin/saw-credential-proxy" "supervise") $supervisorArgs (list "--upstream-proxy" "http://127.0.0.1:3128" "--upstream-proxy-connect-by-hostname" "--upstream-proxy-ca-bundle" "/run/openshell/saw-proxy-ca.pem")) }}
{{- else }}
{{- $_ := set $policy "supervisorCommand" (concat $supervisorArgs (list "--upstream-proxy" $proxyURL "--upstream-proxy-connect-by-hostname" "--upstream-proxy-ca-bundle" "/.openshell/supervisor/upstream-proxy-ca.pem")) }}
{{- end }}
{{- $values = toJson $policy }}
{{- end }}
{{- if and (eq $key "proxy") $site.providerPolicy }}
{{- $proxy := fromJson $values }}
{{- $secrets := list }}
{{- range $site.providerPolicy.bindings }}{{- $secrets = append $secrets .secret }}{{- end }}
{{- $_ := set $proxy "credentialSecretNames" ($secrets | uniq | sortAlpha) }}
{{- $_ := set $proxy "policyDigest" ($site.providerPolicy | toJson | sha256sum) }}
{{- $values = toJson $proxy }}
{{- end }}
{{- $release := $u }}
{{- if eq (len $c) 3 }}
{{- $slot := index $c 2 }}
{{- $release = $slot.base }}
{{- $v := $values | fromJson }}
{{- if and $site.lifecycleVersion $slot.modelInput }}{{- $_ := set $v "shareGateForModelSelection" true }}{{- end }}
{{- $_ := set $v.identity "workspace" $slot.workspace }}{{- $_ := set $v.identity "sandbox" $slot.sandbox }}
{{- $values = toJson $v }}
{{- end }}
{{- if regexMatch "@[A-Z_]+@" $values }}{{ fail "unknown site value placeholder" }}{{ end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "saw-c-%s-%s" $reg $key }}
  namespace: {{ $g.vpArgoNamespace }}
  labels: {saw.redhat.com/registration: {{ $reg | quote }}, openshell.pattern/owner: {{ $u | quote }}}
  finalizers: [resources-finalizer.argocd.argoproj.io/foreground]
spec:
  project: {{ $site.project | default "default" }}
  destination: {server: 'https://kubernetes.default.svc', namespace: {{ index $c 1 }}}
  source:
    repoURL: {{ $g.repoURL | quote }}
    targetRevision: {{ $item.revision | quote }}
    path: charts/{{ index $c 0 }}
    helm:
      {{- if and (eq $key "gateway") (eq $stack.identity.revision $g.targetRevision) (eq $item.revision $g.targetRevision) }}
      # The identity bootstrap independently checks both discovery endpoints
      # against the destination API server before issuing gateway credentials.
      apiVersions:
        - agents.x-k8s.io/v1beta1/Sandbox
        - policy.networking.k8s.io/v1alpha1/AdminNetworkPolicy
      {{- end }}
      releaseName: {{ $release }}
      valuesObject: {{ $values }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 8}
{{- end }}
{{- end }}
