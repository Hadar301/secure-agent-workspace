# Generated by scripts/saw-profile-catalog.py from charts/saw-bom/profiles; do not edit.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-saw-workspace
  title: Create an agent workspace
  description: 'Your own Secure Agent Workspace: a VM with OpenShell and the OpenClaw / NemoClaw sandboxes
    of a SAW-BOM profile. Keys go to Vault, not to Git.'
  tags:
  - openshell
  - openclaw
  - nemoclaw
  - secure-agent-workspace
spec:
  owner: user:default/admin
  type: agent-workspace
  parameters:
  - title: Workspace profile
    description: The workspace is named after you (namespace saw-<your user name>).
    required:
    - profile
    properties:
      profile:
        title: Profile
        type: string
        enum:
        - custom-inference
        - data-science
        enumNames:
        - 'custom-inference: Agent workspace backed by a custom OpenAI-compatible endpoint (vLLM, Ollama,
          ...)'
        - 'data-science: Data science workspace with NVIDIA inference and web search; CUDA development
          workspace with NVIDIA inference'
        default: data-science
    dependencies:
      profile:
        oneOf:
        - properties:
            profile:
              const: custom-inference
            inference__api_key:
              title: 'inference: API key'
              type: string
              ui:field: Secret
              description: Stored in Vault for your workspace only (provider openai)
            inference__url:
              title: 'inference: Endpoint base URL (OpenAI-compatible, ending in /v1)'
              type: string
              pattern: ^https?://
            inference__model:
              title: 'inference: Model'
              type: string
            web_search__api_key:
              title: 'web-search: API key'
              type: string
              ui:field: Secret
              description: Stored in Vault for your workspace only (provider brave)
          required:
          - inference__api_key
          - inference__url
          - inference__model
          - web_search__api_key
        - properties:
            profile:
              const: data-science
            uiRoutes:
              title: Sandbox web UIs
              type: 'null'
              description: 'Published on their own route, signed in with Keycloak, for you only: notebook
                (default)'
            inference__api_key:
              title: 'inference: API key'
              type: string
              ui:field: Secret
              description: Stored in Vault for your workspace only (provider nvidia)
            web_search__api_key:
              title: 'web-search: API key'
              type: string
              ui:field: Secret
              description: Stored in Vault for your workspace only (provider brave)
          required:
          - inference__api_key
          - web_search__api_key
  steps:
  - id: request
    name: Submit the request
    action: http:backstage:request
    input:
      method: POST
      path: /proxy/saw-requests
      headers:
        Content-Type: application/json
      body:
        apiVersion: v1
        kind: Secret
        metadata:
          generateName: saw-req-
          labels:
            saw.redhat.com/request: 'true'
        type: Opaque
        stringData:
          action: create
          token: ${{ secrets.backstageToken }}
          profile: ${{ parameters.profile }}
          inference.api_key: ${{ secrets.inference__api_key }}
          inference.url: ${{ parameters.inference__url }}
          inference.model: ${{ parameters.inference__model }}
          web-search.api_key: ${{ secrets.web_search__api_key }}
  - id: run
    name: Create the workspace
    action: http:backstage:request
    input:
      method: POST
      path: /proxy/saw-pipelineruns
      headers:
        Content-Type: application/json
      body:
        apiVersion: tekton.dev/v1
        kind: PipelineRun
        metadata:
          generateName: saw-create-
          labels:
            saw.redhat.com/request: 'true'
        spec:
          pipelineRef:
            name: saw-workspace-create
          taskRunTemplate:
            serviceAccountName: __PROVISIONER_SA__
          params:
          - name: request
            value: ${{ steps.request.output.body.metadata.name }}
  output:
    text:
    - title: Workspace requested
      content: Pipeline run **${{ steps.run.output.body.metadata.name }}** registers your workspace; Argo
        CD then creates namespace saw-${{ user.ref | parseEntityRef | pick('name') }} and its VM (about
        10 minutes). It appears in the catalog as saw-${{ user.ref | parseEntityRef | pick('name') }},
        with links to its web UIs.
