{{- if .Values.enabled }}
{{- include "saw-peerpod-csi-lab.validate" . }}
{{- $ns := .Release.Namespace }}
{{- $driver := include "saw-peerpod-csi-lab.driver" . }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: controller, namespace: {{ $ns }}}
spec:
  replicas: {{ ternary 1 0 .Values.activate }}
  selector: {matchLabels: {app.kubernetes.io/name: '{{ $ns }}-controller'}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: '{{ $ns }}-controller'}
      annotations: {openshift.io/required-scc: nonroot-v2}
    spec:
      serviceAccountName: controller
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions: [{key: node-role.kubernetes.io/kata-oc, operator: DoesNotExist}]
      containers:
      - name: azure-disk
        image: {{ .Values.images.azureDisk | quote }}
        command: [/usr/bin/azurediskplugin]
        args: ['--drivername={{ $driver }}', '--endpoint=unix:///csi/backend.sock', '--cloud-config-secret-name=', '--cloud-config-secret-namespace=', '--v=2']
        env: [{name: AZURE_CREDENTIAL_FILE, value: /etc/kubernetes/azure.json}]
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: socket, mountPath: /csi}, {name: cloud, mountPath: /etc/kubernetes, readOnly: true}, {name: tmp, mountPath: /tmp}]
      - name: wrapper
        image: {{ .Values.images.wrapper | quote }}
        command: [/csi-controller-wrapper]
        args: ['--endpoint=/csi/wrapper.sock', '--target-endpoint=/csi/backend.sock', '--namespace={{ $ns }}', '--v=0']
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: socket, mountPath: /csi}]
      - name: provisioner
        image: {{ .Values.images.provisioner | quote }}
        args: ['--csi-address=/csi/wrapper.sock', '--leader-election=true', '--leader-election-namespace={{ $ns }}', '--extra-create-metadata=true', '--timeout=120s', '--worker-threads=2', '--v=2']
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: socket, mountPath: /csi}]
      - name: attacher
        image: {{ .Values.images.attacher | quote }}
        args: ['--csi-address=/csi/wrapper.sock', '--leader-election=true', '--leader-election-namespace={{ $ns }}', '--timeout=300s', '--worker-threads=2', '--v=2']
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: socket, mountPath: /csi}]
      - name: liveness
        image: {{ .Values.images.liveness | quote }}
        args: ['--csi-address=/csi/wrapper.sock', '--http-endpoint=0.0.0.0:9808', '--probe-timeout=3s', '--v=2']
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
        securityContext: {runAsUser: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        readinessProbe: {httpGet: {path: /healthz, port: 9808}, initialDelaySeconds: 5, periodSeconds: 5}
        volumeMounts: [{name: socket, mountPath: /csi}]
      volumes:
      - {name: socket, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
      - name: cloud
        secret:
          secretName: {{ .Values.cloudConfigSecret }}
          defaultMode: 0440
          items: [{key: azure.json, path: azure.json}]
{{- end }}
