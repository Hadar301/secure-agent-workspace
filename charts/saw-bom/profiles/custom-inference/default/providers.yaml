apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata:
  profile: custom-inference
spec:
  providers:
    # OpenShell's `openai` provider type for an OpenAI-compatible server. A
    # provider only holds the credential: the sandbox gets a placeholder key
    # and the proxy adds the real one for the profile's endpoints. The
    # endpoint and the model are workload settings, in the sandbox's `env:`
    # (sandbox.yaml), as OpenShell documents.
    - name: custom
      type: openai
      credentialSecret: inference
      credentialSecretKey: api_key
      # Self-hosted models can take longer than OpenShell's 60 s default.
      inferenceTimeout: 300
    - name: brave
      type: brave
      credentialSecret: web-search
      credentialSecretKey: api_key
