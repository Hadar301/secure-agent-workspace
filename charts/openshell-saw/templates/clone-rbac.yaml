{{- if .Values.source.dataSourceNamespace }}
{{- if ne .Values.source.dataSourceNamespace .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdi-clone-from-{{ .Values.source.dataSourceNamespace }}
  namespace: {{ .Values.source.dataSourceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cdi-cloner
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
