{{- /* Only what the prepare Job needs. No VM access, no port-forward. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-prepare
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datasources"]
    verbs: ["get", "create"]
  {{- if and .Values.job.waitForSecrets (include "openshell-sandbox.providerSecrets" . | fromJsonArray) }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ include "openshell-sandbox.providerSecrets" . }}
    verbs: ["get"]
  {{- end }}
  {{- if .Values.dashboard.enabled }}
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get"]
  {{- end }}
