apiVersion: batch/v1
kind: Job
metadata:
  name: mirror-${IMAGE}
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: image-mirror
      restartPolicy: Never
      containers:
      - name: mirror
        image: registry.redhat.io/ubi8/skopeo:latest
        env:
        - name: HOME
          value: /tmp/skopeo-home
        - name: XDG_RUNTIME_DIR
          value: /tmp/xdg-runtime
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          mkdir -p "${HOME}" "${XDG_RUNTIME_DIR}"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          skopeo copy --src-tls-verify=true --dest-tls-verify=false \
            --dest-creds="unused:${TOKEN}" \
            "docker://${QUAY_REPO}/${IMAGE}:${VERSION}" \
            "docker://image-registry.openshift-image-registry.svc:5000/${BUILD_NS}/${IMAGE}:${VERSION}"
          echo "Mirror complete: ${IMAGE}:${VERSION}"
