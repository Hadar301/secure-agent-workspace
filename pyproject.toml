[project]
name = "secure-agent-workspace-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8,<4",
    "PyYAML>=6",
    "cryptography>=41",
    "openshell-saw",
]

[tool.uv]
package = false

[tool.uv.sources]
openshell-saw = { path = "cli", editable = true }

[tool.pytest.ini_options]
markers = [
    "ci_external: external tools or static assets only; runs once in CI",
]
